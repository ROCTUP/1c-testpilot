# Укажите путь к этому файлу в TC1C_PROFILES_FILE.
# Все допустимые параметры показаны ниже в разных вариантах профилей.
# С base — запуск через launch_client; без base — подключение через connect.
# Относительные пути base (для файловой базы) и exe считаются от папки этого YAML.
profiles:
  # Файловая база: пустой пароль, изолированный рабочий стол, увеличенное ожидание запуска.
  ut_admin:
    description: Демо УТ, администратор
    base: 'G:\1C\1C\_DB\УправлениеТорговлей\_Демо'  # Каталог файловой базы.
    user: Администратор                 # Пользователь 1С.
    password: ''                        # Пароль строкой; '' — пустой. Вместо него можно password_env.
    desktop: isolated                   # isolated — отдельный рабочий стол; default — обычный (по умолчанию).
    wait: 90                            # Ожидание запуска и подключения в секундах; по умолчанию 60.
    connect: true                       # Сразу подключиться после запуска (по умолчанию).

  # Тонкий клиент: конкретная платформа, пароль из окружения и дополнительные аргументы 1С.
  ut_manager:
    description: Демо УТ, менеджер
    base: 'G:\1C\1C\_DB\УправлениеТорговлей\_Демо'
    user: Менеджер
    password_env: UT_MANAGER_PASSWORD    # Имя переменной окружения MCP-сервера с паролем; не вместе с password.
    exe: 'C:\Program Files\1cv8\8.3.27.1859\bin\1cv8c.exe'  # 1cv8c — тонкий, 1cv8 — толстый клиент.
    version: '8.3.27.1859'               # Версия платформы; при запуске обычно определяется по exe.
    extra_args: ['/L', 'ru']             # Дополнительные аргументы командной строки 1С, здесь — язык интерфейса.
    desktop: default

  # Серверная база: запустить локальный клиент, но подключиться к нему отдельно.
  ut_server:
    description: УТ, серверная база
    base: 'server1c\Trade'               # Адрес сервера 1С и имя информационной базы.
    server: true                        # Серверная база; false (по умолчанию) — файловая.
    user: Администратор
    password_env: UT_SERVER_PASSWORD
    version: '8.3.27.1859'
    port: 1600                          # Порт клиента тестирования; если не указан, выбирается свободный.
    wait: 120
    connect: false                      # Дождаться открытия порта без подключения MCP к клиенту.

  # Подключение к клиенту, запущенному профилем ut_server на компьютере MCP-сервера.
  local_started:
    description: Подключение после отдельного запуска
    host: 127.0.0.1                     # По умолчанию 127.0.0.1; адрес компьютера с тест-клиентом.
    port: 1600                          # Для подключения обязателен; должен совпадать с портом клиента.
    version: '8.3.27.1859'              # Должна соответствовать запущенной платформе.

  # Подключение к тест-клиенту на другом компьютере: только host, port, version и description.
  remote_demo:
    description: Уже запущенный удалённый тест-клиент
    host: 192.168.1.101
    port: 1600
    version: '8.3.27.1859'
