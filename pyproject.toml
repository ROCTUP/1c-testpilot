[project]
name = "1c-testpilot"
version = "1.4.0"
description = "MCP-сервер для управления тест-клиентом 1С:Предприятие"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ROCTUP" }]
keywords = ["1c", "mcp", "openai", "gateway", "bsl", "testclient", "testing", "ui-automation", "claude"]
dependencies = [
    "anyio>=4.5",
    "mcp>=1.28.1,<2",
    "toon-format==0.9.0b1",
    "pefile",
    "cryptography>=43",
    "pywin32; sys_platform == 'win32'",
    "Pillow>=10",
    "psutil>=6.0",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/ROCTUP/1c-testpilot"

[project.scripts]
"1c-testpilot" = "server:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "app" }
py-modules = ["server", "tc1c", "guids", "_collection", "_response", "_refs", "_connections", "_field_batches", "_snapshots", "_snapshot_tables", "_form_context", "_action_diagnostics", "_native_window", "_desktop_windows", "_desktop_linux", "_screenshots", "_screenshot_windows", "_screenshot_linux", "_screenshot_image", "tool_versions"]
